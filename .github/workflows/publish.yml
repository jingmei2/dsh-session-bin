name: publish

# 只在打 tag 时发布，避免每次 push 都触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Trusted Publishing 必需：id-token: write 用来换取 OIDC 短时凭证，
# 同时也让 registry 自动为该版本生成 provenance 证明（npm 页面上的徽章）。
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 故意不设 registry-url：setup-node 会往 .npmrc 写一条
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}，
      # 纯 OIDC 模式下该变量为空，反而触发 ENEEDAUTH。
      # 目标 registry 由 package.json 的 publishConfig.registry 决定。
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: 升级 npm
        run: npm install -g npm@latest
        # Trusted Publishing 要求 npm >= 11.5.1

      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 package.json 的 ${PKG} 不一致"
            exit 1
          fi

      # 用显式 glob：Node 24 把 `node --test test/` 的目录参数当模块去 require，
      # 直接 MODULE_NOT_FOUND；Node 26 才支持目录发现。glob 在两者下都成立。
      - name: 单元测试
        run: node --test test/*.test.mjs

      - name: 发布
        run: npm publish
        # 不传 NODE_AUTH_TOKEN，也不需要 --provenance：
        # OIDC 自动完成认证并生成 provenance 证明
